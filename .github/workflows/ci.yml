name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore
      - name: Generated DTOs are up to date
        run: |
          ./tools/generate.sh
          git diff --exit-code -- src/Librus.Api/Generated
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release tests/Librus.Tests
      - name: NativeAOT publish (linux-x64)
        run: dotnet publish src/Librus.Cli -c Release -r linux-x64 -o artifacts/linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: librus-net-linux-x64
          path: artifacts/linux-x64/librus-net
